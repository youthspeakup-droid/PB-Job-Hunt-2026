<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PB Job Hunt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; background: #f4f5f7; color: #111; }
    .box { text-align: center; padding: 48px 56px; background: #fff;
           border-radius: 14px; border: 1px solid #e5e7eb; max-width: 480px;
           box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p  { color: #6b7280; font-size: 14px; line-height: 1.55; margin: 0 0 8px; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>📋 PB Job Hunt</h1>
    <p>Your first job report will appear here after the agent runs.</p>
    <p>Go to the <code>Actions</code> tab in your repository and click
       <strong>Run workflow</strong> to trigger it now — or wait until 8 AM
       Mon–Fri for the scheduled run.</p>
  </div>
</body>
</html>
